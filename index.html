<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Portal</title>

    <!-- Favicon: SNSVM Test Portal seal, provided as public/favicon.png.
         Multiple sizes are referenced where available; browsers pick the
         best match. apple-touch-icon covers "Add to Home Screen" on iOS. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#16233d" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Was written but never linked before — this is what actually makes
         the profile avatar a real circle instead of flat text, plus new
         polish on top of it. See comments at the top of the file. -->
    <link rel="stylesheet" href="/src/styles_design_fix.css" />
    <!-- Aligns the landing page's colors with the parchment/green-gold-
         terracotta theme already used on the login pages. Loaded last so
         it wins the cascade on landing-page-scoped selectors. -->
    <link rel="stylesheet" href="/src/styles_landing_theme.css" />
    <link rel="stylesheet" href="/src/styles_v7_public_rankings.css" />
    <link rel="stylesheet" href="/src/styles_v19_professional.css" />
    <link rel="stylesheet" href="/src/styles_admin_pro.css" />
    <link rel="stylesheet" href="/src/styles_schedule_picker.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Development/production safety net: never leave a completely blank page
      // when a module or runtime error occurs before React can mount.
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || root.dataset.portalError) return;
        root.dataset.portalError = '1';
        var message = event && event.error && event.error.message ? event.error.message : (event.message || 'Unknown JavaScript error');
        root.innerHTML = '<div style="max-width:760px;margin:60px auto;padding:28px;border:1px solid #e7b6b6;border-radius:16px;background:#fff8f8;font-family:Inter,Arial,sans-serif;color:#16233d"><h2 style="margin:0 0 10px;color:#7f1d1d">Portal could not start</h2><p style="margin:0 0 14px">A browser-side error prevented the portal from loading.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:14px;border-radius:10px;border:1px solid #ead8d8">'+String(message).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre><p style="margin:14px 0 0;font-size:13px">Open the browser Developer Tools → Console if further diagnostics are needed.</p></div>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason) console.error('Unhandled portal promise rejection:', event.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
