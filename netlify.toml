[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API routes go to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Everything else is a client-side React route (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
